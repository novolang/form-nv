[package]
name        = "form-nv"
version     = "0.1.0"
description = "HTML form bodies decoded from bytes: `application/x-www-form-urlencoded` to the WHATWG parser and serialiser, as ranges into the caller's own bytes, and `multipart/form-data` as a feed-and-drain reader that answers part headers and body ranges and never holds a part, with per-part and total limits that refuse rather than grow.  Typed field reads whose refusals name the field.  The urlencoded scanner is `@value` state and builds for a microcontroller."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet, and the tests were written against the signatures rather
# than by a consumer.
stability   = "experimental"

# `core`.  A form body is bytes the caller already holds, and decoding
# one is arithmetic over them.  The multipart reader is fed chunks and
# answers events, which is how a `core` package takes a stream it must
# not accumulate.
#
# `formscan` builds for a microcontroller.  `tests/embedded_probe.nv`
# is the firmware image that shows it, and `tests/alloc_scan.sh` reads
# the emitted LLVM and checks that no function in `formscan` calls the
# allocator.
layer       = "core"

category    = "web"

tags        = ["form", "urlencoded", "multipart", "form-data", "http", "upload", "sans-io", "embedded"]
repository  = "https://github.com/novolang/form-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.13.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "A parser that never holds a part, and a scanner that fits in four integers"

[dependencies]
# mime-nv, for the boundary.  It is a parameter of the `Content-Type`
# header, and reading it is RFC 2045's token and quoted-string grammar.
# `formpart.boundary_of` and `boundary_of_type` are the whole of the
# dependency's use; `formscan` does not name it.
#
# url-nv is not a dependency.  Its `qs` module parses query strings to
# Python urllib's rules, and this package implements the WHATWG parser,
# which differs in the four places the README lists.
mime-nv = "^0.1.0"
